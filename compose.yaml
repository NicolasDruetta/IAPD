x-lab-image: &lab-image
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: apache-big-data-lab:local
  restart: unless-stopped

services:
  kafka:
    image: apache/kafka:4.0.0
    hostname: kafka
    cpus: "0.5"
    mem_limit: 768m
    mem_reservation: 512m
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NODE_ID: "1"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
    ports:
      - "29092:29092"
    volumes:
      - ./data/kafka-secrets:/etc/kafka/secrets
      - ./data/kafka-config:/mnt/shared/config
      - ./data/kafka:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  spark-master:
    <<: *lab-image
    hostname: spark-master
    cpus: "0.5"
    mem_limit: 512m
    mem_reservation: 256m
    memswap_limit: 512m
    command:
      - spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    environment:
      SPARK_DAEMON_MEMORY: 384m
    volumes:
      - ./data:/app/data
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          payload=json.load(urllib.request.urlopen(
          "http://localhost:8080/json/", timeout=2));
          assert "workers" in payload
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  spark-worker-1:
    <<: *lab-image
    hostname: spark-worker-1
    cpus: "1.0"
    mem_limit: 1g
    mem_reservation: 768m
    memswap_limit: 1g
    command:
      - spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --host
      - spark-worker-1
      - --webui-port
      - "8081"
    environment:
      SPARK_WORKER_CORES: "1"
      SPARK_WORKER_MEMORY: 768m
      SPARK_DAEMON_MEMORY: 384m
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_healthy
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, socket, urllib.request;
          payload=json.load(urllib.request.urlopen(
          "http://spark-master:8080/json/", timeout=2));
          assert any(worker.get("host") == socket.gethostname()
          for worker in payload.get("workers", []))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  spark-worker-2:
    <<: *lab-image
    hostname: spark-worker-2
    cpus: "1.0"
    mem_limit: 1g
    mem_reservation: 768m
    memswap_limit: 1g
    command:
      - spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --host
      - spark-worker-2
      - --webui-port
      - "8082"
    environment:
      SPARK_WORKER_CORES: "1"
      SPARK_WORKER_MEMORY: 768m
      SPARK_DAEMON_MEMORY: 384m
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8082:8082"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, socket, urllib.request;
          payload=json.load(urllib.request.urlopen(
          "http://spark-master:8080/json/", timeout=2));
          assert any(worker.get("host") == socket.gethostname()
          for worker in payload.get("workers", []))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  streamlit:
    <<: *lab-image
    hostname: spark-driver
    cpus: "1.5"
    mem_limit: 2g
    mem_reservation: 1g
    memswap_limit: 2g
    command:
      - streamlit
      - run
      - main.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: iapd-market-events
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_DRIVER_HOST: spark-driver
      SPARK_DRIVER_PORT: "4041"
      SPARK_BLOCK_MANAGER_PORT: "4042"
      SPARK_MASTER_UI_URL: http://spark-master:8080
      SPARK_UI_URL: http://localhost:4040
      SPARK_DRIVER_MEMORY: 1g
      SPARK_EXECUTOR_MEMORY: 512m
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker-1:
        condition: service_healthy
      spark-worker-2:
        condition: service_healthy
    ports:
      - "8502:8501"
    volumes:
      - ./data:/app/data

